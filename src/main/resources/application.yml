spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/campus_agent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

mcp:
  internal:
    service-key: ${MCP_INTERNAL_SERVICE_KEY:}
    require-service-key: true
  connectivity:
    connect-timeout: ${MCP_CONNECTIVITY_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${MCP_CONNECTIVITY_READ_TIMEOUT:PT5S}
  execution:
    mode: ${MCP_EXECUTION_MODE:http}
    connect-timeout: ${MCP_EXECUTION_CONNECT_TIMEOUT:PT2S}
    call-timeout: ${MCP_EXECUTION_CALL_TIMEOUT:PT10S}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.agent.mcp.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
