services:
  postgres:
    image: postgres:17
    container_name: campus-agent-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_agent}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - campus_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-campus_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_agent_postgres:
