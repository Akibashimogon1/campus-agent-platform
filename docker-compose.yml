services:
  postgres:
    image: postgres:17
    container_name: campus-agent-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_agent}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campus_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-campus_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-agent-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-campus_agent}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:-dev-only-change-this-jwt-secret-at-least-32-bytes}
      MCP_JWT_EXPIRATION: ${MCP_JWT_EXPIRATION:-3600000}
      MCP_INTERNAL_SERVICE_KEY: ${MCP_INTERNAL_SERVICE_KEY:-}
      MCP_INTERNAL_REQUIRE_SERVICE_KEY: ${MCP_INTERNAL_REQUIRE_SERVICE_KEY:-false}
      MCP_EXECUTION_MODE: ${MCP_EXECUTION_MODE:-mock}
      MCP_CONNECTIVITY_CONNECT_TIMEOUT: ${MCP_CONNECTIVITY_CONNECT_TIMEOUT:-PT2S}
      MCP_CONNECTIVITY_READ_TIMEOUT: ${MCP_CONNECTIVITY_READ_TIMEOUT:-PT5S}
      MCP_EXECUTION_CONNECT_TIMEOUT: ${MCP_EXECUTION_CONNECT_TIMEOUT:-PT2S}
      MCP_EXECUTION_CALL_TIMEOUT: ${MCP_EXECUTION_CALL_TIMEOUT:-PT10S}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-agent-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  campus_agent_postgres:
